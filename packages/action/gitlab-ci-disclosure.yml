# MadeBy disclosure check — GitLab CI job.
#
# The same `madeby check` gate as the GitHub Action, on GitLab. There is NO range logic here: on a
# merge-request pipeline `madeby check` auto-scopes to the MR's own commits from the GitLab env (the
# gitlab host adapter reads CI_PIPELINE_SOURCE + CI_MERGE_REQUEST_DIFF_BASE_SHA + CI_COMMIT_SHA).
# Disclosure, never detection — the maintainer owns the policy in `.madeby/policy.json`.
#
# Include it from your .gitlab-ci.yml:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/MacDougherty/MadeBy/v0.2.0/packages/action/gitlab-ci-disclosure.yml'
#
# Then require the "disclosure" job on the target branch via a merge-request approval / pipeline rule.

disclosure:
  image: node:20
  variables:
    GIT_DEPTH: 0 # so the MR base + head SHAs are present for the range
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - npx --yes madeby check
